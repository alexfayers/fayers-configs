[tool.ruff]
line-length = 120
indent-width = 4
show-fixes = true
preview = true
target-version = "py312"
# unsafe-fixes = true
extend-exclude = ["build"]

[tool.ruff.lint]
future-annotations = true
extend-ignore = [
    "COM812",
    "D100",
    "D101",
    "D104",
    "D105",
    "D107",
    "FIX",
    "PLC0414",
    "TD002",
    "TD003",
    "UP040",
    "FBT001",  # maybe useful, but annoying
    "FBT002",  # maybe useful, but annoying
    "CPY001",
    "SIM108",
    "DOC502",
    "S404",
    "S603",
    "S311",
    "PLR6301",
    "C901",
]
extend-safe-fixes = [
    "ANN",
    "EM",
    "TC001",
    "TC002",
    "TC003",
    "TC004",
    "TID252",
    "UP045",
    "UP006",
    "G004",
    "D415",
]
unfixable = ["T201"]
select = ["ALL"]

[tool.ruff.lint.extend-per-file-ignores]
"scripts/*" = ["T201"]
"*test*" = [
    "T201",
    "ANN001",
    "ANN201",
    "ANN202",
    "ARG002",
    "D102",
    "D103",
    "PLR2004",
    "S101",
    "SLF001",
    "INP001",
    "PLR2004",
    "PLC0415",
    "PLR6201",
    "PLR0904",
    "PLR6301",
    "DOC",
    "PLC2701",
    "N802",
    "PLC1901",
    "FBT003",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
force-wrap-aliases = true

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 150

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true
